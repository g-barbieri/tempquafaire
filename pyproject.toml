[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schedule-repair"
version = "0.1.0"
description = "Import and repair school timetables under hard and soft constraints."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
schedule-repair = "schedule_repair.cli:main"
schedule-repair-analyze = "schedule_repair.analyze_cli:main"
schedule-repair-optimize = "schedule_repair.optimize_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
